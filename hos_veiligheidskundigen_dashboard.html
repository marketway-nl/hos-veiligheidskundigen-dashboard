<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOS Veiligheidskundigen — Leads dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #ebebeb; min-height: 100vh; padding: 2rem; color: #555555; }
    .dash-wrap { max-width: 960px; margin: 0 auto; background: #f5f5f5; border-radius: 12px; padding: 2rem; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #dcdcdc; }
    .dash-logo { display: flex; align-items: center; gap: 10px; }
    .dash-logo-mark { width: 32px; height: 32px; background: #2d57b8; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .dash-logo-mark i { font-size: 18px; color: #fff; }
    .dash-title { font-size: 15px; font-weight: 500; color: #555555; }
    .dash-sub { font-size: 12px; color: #999; margin-top: 2px; }
    .refresh-btn { font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 12px; border: 1px solid #dcdcdc; border-radius: 8px; background: #fff; color: #555555; }
    .refresh-btn:hover { background: #ececec; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .metric-card { background: #fff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 1rem; border-top: 3px solid #2d57b8; }
    .metric-label { font-size: 11px; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 22px; font-weight: 500; color: #2d57b8; }
    .metric-sub { font-size: 11px; color: #bbb; margin-top: 4px; }
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
    .chart-card { background: #fff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 1rem; }
    .section-label { font-size: 11px; font-weight: 500; color: #999; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; font-size: 12px; color: #555555; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .table-card { background: #fff; border: 1px solid #dcdcdc; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
    th { background: #f5f5f5; color: #999; font-weight: 500; padding: 9px 12px; text-align: left; border-bottom: 1px solid #dcdcdc; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; color: #555555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .badge-won { background: #e6f3d8; color: #3b6d11; }
    .badge-lost { background: #fce8e8; color: #a32d2d; }
    .badge-open { background: #e8edf8; color: #2d57b8; }
    .empty-state { text-align: center; padding: 2.5rem 1rem; color: #bbb; font-size: 13px; }
    .error-state { text-align: center; padding: 2rem 1rem; color: #a32d2d; font-size: 13px; }
    @media (max-width: 600px) { .charts-row { grid-template-columns: 1fr; } body { padding: 1rem; } }
  </style>
</head>
<body>
  <div class="dash-wrap">
    <div class="dash-header">
      <div class="dash-logo">
        <div class="dash-logo-mark"><i class="ti ti-chart-bar"></i></div>
        <div>
          <p class="dash-title">HOS Veiligheidskundigen — Leads</p>
          <p class="dash-sub" id="last-updated">Laden...</p>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadData()"><i class="ti ti-refresh"></i> Vernieuwen</button>
    </div>

    <div class="metric-grid" id="metrics">
      <div class="metric-card"><p class="metric-label">Contactmomenten</p><p class="metric-value">—</p><p class="metric-sub">totaal gemeten</p></div>
      <div class="metric-card"><p class="metric-label">Offertes verstuurd</p><p class="metric-value">—</p><p class="metric-sub">&nbsp;</p></div>
      <div class="metric-card"><p class="metric-label">Gewonnen leads</p><p class="metric-value">—</p><p class="metric-sub">&nbsp;</p></div>
      <div class="metric-card"><p class="metric-label">Geschatte omzet</p><p class="metric-value">—</p><p class="metric-sub">gewonnen leads</p></div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <p class="section-label">Kanaal</p>
        <div class="legend" id="legend-kanaal"></div>
        <div style="position: relative; height: 180px;">
          <canvas id="chartKanaal" role="img" aria-label="Donut grafiek van contactmomenten per kanaal">Laden...</canvas>
        </div>
      </div>
      <div class="chart-card">
        <p class="section-label">Status</p>
        <div class="legend" id="legend-status"></div>
        <div style="position: relative; height: 180px;">
          <canvas id="chartStatus" role="img" aria-label="Donut grafiek van leadstatus verdeling">Laden...</canvas>
        </div>
      </div>
    </div>

    <p class="section-label">Recente contactmomenten</p>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width:90px">Datum</th>
            <th style="width:80px">Kanaal</th>
            <th style="width:130px">Bedrijf</th>
            <th style="width:130px">Dienst</th>
            <th style="width:65px">Offerte</th>
            <th style="width:90px">Omzet</th>
            <th style="width:85px">Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" class="empty-state">Laden...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SHEET_ID = '1bd7z8UwyZnTM6nUBNw7DKstKuCp6KBb0ZEFBpp-OMNo';
    const API_KEY = 'AIzaSyCoq0sc94BxVHFDcspjFsU44rnUkP-wvzo';
    const RANGE = 'Formulierreacties 1';

    let chartKanaal = null;
    let chartStatus = null;

    const KANAAL_COLORS = { 'Telefoon': '#2d57b8', 'Mail': '#555555', 'Formulier inzending': '#dcdcdc' };
    const STATUS_COLORS = { 'Gewonnen': '#5a9e2f', 'Verloren': '#c94040', 'Nog open': '#2d57b8' };

    function formatDate(str) {
      if (!str) return '—';
      const d = new Date(str);
      if (isNaN(d)) return str;
      return d.toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatEuro(val) {
      if (!val || val === '') return '—';
      const n = parseFloat(String(val).replace(/[^0-9.,]/g, '').replace(',', '.'));
      if (isNaN(n)) return '—';
      return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
    }

    function statusBadge(s) {
      if (!s) return '<span class="badge badge-open">Onbekend</span>';
      if (s.toLowerCase().includes('gewonnen')) return '<span class="badge badge-won">Gewonnen</span>';
      if (s.toLowerCase().includes('verloren')) return '<span class="badge badge-lost">Verloren</span>';
      return '<span class="badge badge-open">' + s + '</span>';
    }

    function buildLegend(id, labels, data, colors) {
      const total = data.reduce((a, b) => a + b, 0);
      document.getElementById(id).innerHTML = labels.map((l, i) => {
        const pct = total > 0 ? Math.round((data[i] / total) * 100) : 0;
        return `<span class="legend-item"><span class="legend-dot" style="background:${colors[l] || '#888'}"></span>${l} ${pct}%</span>`;
      }).join('');
    }

    function renderPie(canvasId, labels, data, colors) {
      const ctx = document.getElementById(canvasId);
      const existing = canvasId === 'chartKanaal' ? chartKanaal : chartStatus;
      if (existing) existing.destroy();
      const chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data, backgroundColor: labels.map(l => colors[l] || '#888'), borderWidth: 3, borderColor: '#f5f5f5' }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + ctx.parsed } } },
          cutout: '62%'
        }
      });
      if (canvasId === 'chartKanaal') chartKanaal = chart;
      else chartStatus = chart;
    }

    async function loadData() {
      document.getElementById('last-updated').textContent = 'Laden...';
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(RANGE)}?key=${API_KEY}`;
      let rows;
      try {
        const res = await fetch(url);
        const json = await res.json();
        if (json.error) throw new Error(json.error.message);
        rows = (json.values || []).slice(1);
      } catch(e) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="7" class="error-state">Fout bij laden: ${e.message}</td></tr>`;
        document.getElementById('last-updated').textContent = 'Laden mislukt';
        return;
      }

      if (!rows.length) {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="7" class="empty-state">Nog geen inzendingen beschikbaar</td></tr>';
        document.getElementById('last-updated').textContent = 'Geen data';
        return;
      }

      let totaalOmzet = 0, offertesVerstuurd = 0, gewonnen = 0;
      const kanaalTelling = {}, statusTelling = {};

      rows.forEach(r => {
        const kanaal = r[1] || 'Onbekend';
        const offerte = r[6] || '';
        const omzetRaw = r[7] || '';
        const status = r[8] || 'Nog open';
        kanaalTelling[kanaal] = (kanaalTelling[kanaal] || 0) + 1;
        statusTelling[status] = (statusTelling[status] || 0) + 1;
        if (offerte.toLowerCase() === 'ja') offertesVerstuurd++;
        if (status.toLowerCase().includes('gewonnen')) gewonnen++;
        const n = parseFloat(String(omzetRaw).replace(/[^0-9.,]/g, '').replace(',', '.'));
        if (!isNaN(n)) totaalOmzet += n;
      });

      const conversieRatio = offertesVerstuurd > 0 ? Math.round((gewonnen / offertesVerstuurd) * 100) : 0;

      document.getElementById('metrics').innerHTML = `
        <div class="metric-card"><p class="metric-label">Contactmomenten</p><p class="metric-value">${rows.length}</p><p class="metric-sub">totaal gemeten</p></div>
        <div class="metric-card"><p class="metric-label">Offertes verstuurd</p><p class="metric-value">${offertesVerstuurd}</p><p class="metric-sub">van ${rows.length} contacten</p></div>
        <div class="metric-card"><p class="metric-label">Gewonnen leads</p><p class="metric-value">${gewonnen}</p><p class="metric-sub">${conversieRatio}% conversieratio</p></div>
        <div class="metric-card"><p class="metric-label">Geschatte omzet</p><p class="metric-value">${new Intl.NumberFormat('nl-NL', {style:'currency',currency:'EUR',maximumFractionDigits:0}).format(totaalOmzet)}</p><p class="metric-sub">gewonnen leads</p></div>
      `;

      const kLabels = Object.keys(kanaalTelling);
      const sLabels = Object.keys(statusTelling);
      const kData = kLabels.map(l => kanaalTelling[l]);
      const sData = sLabels.map(l => statusTelling[l]);

      buildLegend('legend-kanaal', kLabels, kData, KANAAL_COLORS);
      buildLegend('legend-status', sLabels, sData, STATUS_COLORS);
      renderPie('chartKanaal', kLabels, kData, KANAAL_COLORS);
      renderPie('chartStatus', sLabels, sData, STATUS_COLORS);

      const recent = [...rows].reverse().slice(0, 25);
      document.getElementById('table-body').innerHTML = recent.map(r => `
        <tr>
          <td>${formatDate(r[2])}</td>
          <td>${r[1] || '—'}</td>
          <td title="${r[3] || ''}">${r[3] || '—'}</td>
          <td title="${r[5] || ''}">${r[5] || '—'}</td>
          <td>${r[6] || '—'}</td>
          <td>${formatEuro(r[7])}</td>
          <td>${statusBadge(r[8])}</td>
        </tr>
      `).join('');

      document.getElementById('last-updated').textContent = 'Bijgewerkt om ' + new Date().toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
    }

    loadData();
  </script>
</body>
</html>
